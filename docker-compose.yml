services:
  db:
    image: postgres:16-alpine
    container_name: iskcon-temple-db
    environment:
      POSTGRES_USER: iskcon
      POSTGRES_PASSWORD: iskcon
      POSTGRES_DB: iskcon_temple
    ports:
      # 5433 avoids conflict with a local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - iskcon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iskcon -d iskcon_temple"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iskcon-temple-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://iskcon:iskcon@db:5432/iskcon_temple
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: iskcon-temple-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  iskcon_pgdata:
  backend_uploads:
